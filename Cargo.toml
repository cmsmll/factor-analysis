[package]
name = "factor-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.5"
clap = { version = "4.6.2", features = ["derive"] }
crossbeam-channel = "0.5.16"
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
encoding_rs = "0.8.35"
enum_dispatch = "0.3.13"
hex = "0.4.3"
percent-encoding = "2.3.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
salvo = { git = "https://github.com/salvo-rs/salvo.git", rev = "bca7452deab644935ff50f433cf4f917b0b38960", features = ["cors"] }
salvo-oapi = { git = "https://github.com/salvo-rs/salvo.git", rev = "bca7452deab644935ff50f433cf4f917b0b38960", features = ["swagger-ui", "time"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
tempfile = "3.27.0"
time = { version = "0.3.53", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.3"
validator = "0.20.0"
